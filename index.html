<script type="module">
  import { DiscordSDK } from "https://esm.sh/@discord/embedded-app-sdk";

  const discordSdk = new DiscordSDK("1556648763983011860");

  const status = document.querySelector("p");

  async function start() {
    try {
      status.textContent = "Đang kết nối Discord...";

      await discordSdk.ready();

      status.textContent = "Đã kết nối Discord, đang bật Rich Presence...";

      await discordSdk.commands.setActivity({
        activity: {
          type: 0,
          details: "League of Legends",
          state: "Summoner's Rift",
          timestamps: {
            start: Math.floor(Date.now() / 1000)
          },
          assets: {
            large_image: "lol_large",
            large_text: "League of Legends",
            small_image: "lol_small",
            small_text: "League of Legends"
          }
        }
      });

      status.textContent = "🎮 Đang chơi League of Legends";
    } catch (error) {
      console.error(error);
      status.textContent =
        "❌ Lỗi: " + (error?.message || JSON.stringify(error));
    }
  }

  start();
</script>
